# hypridle — bloqueio por inatividade (notebook)
# Suspensão por inatividade fica de fora de propósito; fechar a tampa
# continua suspendendo (padrão do systemd-logind) e bloqueia antes.

general {
    lock_cmd = pidof hyprlock || hyprlock          # evita abrir dois hyprlock
    before_sleep_cmd = loginctl lock-session       # bloqueia antes de suspender (ex.: fechar a tampa)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 2,5 min parado: escurece a tela
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: bloqueia
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5,5 min: apaga a tela
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
