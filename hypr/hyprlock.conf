# hyprlock — tela de bloqueio (mesma paleta do yoru)

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
}

# Hora
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 180
    halign = center
    valign = center
}

# Data
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = rgba(196, 196, 196, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 15
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(20, 18, 18, 0.62)
    font_color = rgba(255, 255, 255, 1.0)
    check_color = rgba(255, 255, 255, 0.4)
    fail_color = rgba(255, 128, 128, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##a0a0a0">Senha</span>
    fail_text = Senha incorreta
    dots_center = true
    position = 0, -40
    halign = center
    valign = center
}
