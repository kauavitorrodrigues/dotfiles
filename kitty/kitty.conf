allow_remote_control yes
confirm_os_window_close 0

map ctrl+shift+t launch --cwd=current --type=window

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font ExtraBold
italic_font      JetBrainsMono Nerd Font Bold Italic
bold_italic_font JetBrainsMono Nerd Font ExtraBold Italic
font_size        14

background_opacity 0.7
window_padding_width 25

cursor_shape beam
cursor_blink_interval 0.5

selection_background #D0D0D0
selection_foreground #000000

foreground #F5F5F5
background #181818

# cores base (mais claras e com mais contraste)
color0  #1C1C1C
color1  #4D4D4D
color2  #707070
color3  #9A9A9A
color4  #C2C2C2
color5  #E6E6E6
color6  #808080
color7  #FFFFFF

# cores brilhantes (ainda mais distintas)
color8  #2A2A2A
color9  #5C5C5C
color10 #8C8C8C
color11 #B5B5B5
color12 #DCDCDC
color13 #FFFFFF
color14 #999999
color15 #FFFFFF

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
